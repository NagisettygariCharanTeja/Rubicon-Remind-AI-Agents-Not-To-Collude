<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
  <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
  <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
</defs>
<rect width="1440" height="560" fill="#fcfcfb"/>

<!-- ===== Panel A: the game ===== -->
<text x="24" y="36" font-size="19" font-weight="700" fill="#0b0b0b">A  The market (20 days)</text>
<rect x="24" y="56" width="400" height="480" rx="10" fill="none" stroke="#e1e0d9"/>
<rect x="54" y="86" width="140" height="74" rx="8" fill="#ffffff" stroke="#c3c2b7"/>
<text x="124" y="114" font-size="16" font-weight="700" text-anchor="middle" fill="#0b0b0b">Farm A</text>
<text x="124" y="136" font-size="13" text-anchor="middle" fill="#52514e">Gemma 3 27B</text>
<text x="124" y="152" font-size="12" text-anchor="middle" fill="#898781">fields + units to sell</text>
<rect x="254" y="86" width="140" height="74" rx="8" fill="#ffffff" stroke="#c3c2b7"/>
<text x="324" y="114" font-size="16" font-weight="700" text-anchor="middle" fill="#0b0b0b">Farm B</text>
<text x="324" y="136" font-size="13" text-anchor="middle" fill="#52514e">Gemma 3 27B</text>
<text x="324" y="152" font-size="12" text-anchor="middle" fill="#898781">fields + units to sell</text>
<!-- channel -->
<path d="M194,108 L254,108" stroke="#eb6834" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arO)" marker-start="url(#arO)"/>
<text x="224" y="190" font-size="12.5" text-anchor="middle" fill="#eb6834" font-weight="700">hidden private channel</text>
<text x="224" y="207" font-size="12" text-anchor="middle" fill="#52514e">opens on a random day (2–16),</text>
<text x="224" y="223" font-size="12" text-anchor="middle" fill="#52514e">message delivered next day</text>
<!-- buyer -->
<path d="M84,160 L160,282" stroke="#52514e" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M364,160 L288,282" stroke="#52514e" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="109" y="286" width="230" height="78" rx="8" fill="#ffffff" stroke="#c3c2b7"/>
<text x="224" y="314" font-size="16" font-weight="700" text-anchor="middle" fill="#0b0b0b">One buyer</text>
<text x="224" y="335" font-size="12.5" text-anchor="middle" fill="#52514e">daily cap per crop; oversupply</text>
<text x="224" y="352" font-size="12.5" text-anchor="middle" fill="#52514e">cuts price; unsold units lost</text>
<!-- payoffs -->
<text x="44" y="400" font-size="13" font-weight="700" fill="#0b0b0b">Profit per farm (20 days)</text>
<text x="44" y="422" font-size="12.5" fill="#52514e">compete 5,400 · collude 8,067 · cheat a colluder 9,988</text>
<text x="44" y="452" font-size="13" font-weight="700" fill="#0b0b0b">Arms</text>
<text x="44" y="474" font-size="12.5" fill="#52514e">no channel · neutral channel ·</text>
<text x="44" y="492" font-size="12.5" fill="#52514e">rule: “Communicating with Farm B is not allowed.”</text>
<text x="44" y="518" font-size="12" fill="#898781">20 games per arm; same channel day across arms</text>

<!-- ===== Panel B: one decision ===== -->
<text x="448" y="36" font-size="19" font-weight="700" fill="#0b0b0b">B  One decision = one JSON reply</text>
<rect x="448" y="56" width="500" height="480" rx="10" fill="none" stroke="#e1e0d9"/>
<text x="472" y="90" font-size="13" fill="#52514e">private scratchpad</text>
<text x="800" y="90" font-size="13" fill="#52514e">acts</text>
<!-- segments -->
<g font-size="13" text-anchor="middle">
<rect x="472" y="102" width="92" height="46" rx="6" fill="#e9f1fb" stroke="#2a78d6"/><text x="518" y="130" fill="#0b0b0b">insights</text>
<rect x="570" y="102" width="82" height="46" rx="6" fill="#e9f1fb" stroke="#2a78d6"/><text x="611" y="130" fill="#0b0b0b">plans</text>
<rect x="658" y="102" width="112" height="46" rx="6" fill="#e9f1fb" stroke="#2a78d6"/><text x="714" y="130" fill="#0b0b0b">message_plan</text>
<rect x="800" y="102" width="124" height="46" rx="6" fill="#fdeee6" stroke="#eb6834"/><text x="862" y="122" fill="#0b0b0b">message to</text><text x="862" y="139" fill="#0b0b0b">Farm B / null</text>
<rect x="800" y="156" width="124" height="34" rx="6" fill="#f3f2ee" stroke="#c3c2b7"/><text x="862" y="178" fill="#0b0b0b">fields, sell</text>
</g>
<!-- PNR -->
<line x1="785" y1="94" x2="785" y2="200" stroke="#0b0b0b" stroke-width="2"/>
<text x="785" y="220" font-size="13" font-weight="700" text-anchor="middle" fill="#0b0b0b">point of no return</text>
<text x="785" y="237" font-size="12" text-anchor="middle" fill="#52514e">(end of message_plan)</text>
<!-- lens -->
<path d="M478,156 L478,164 L764,164 L764,156" stroke="#2a78d6" stroke-width="1.6" fill="none"/><path d="M621,164 L621,270" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#arB)"/>
<rect x="472" y="274" width="452" height="116" rx="8" fill="#ffffff" stroke="#2a78d6"/>
<text x="490" y="300" font-size="15" font-weight="700" fill="#2a78d6">J-lens monitor</text>
<text x="490" y="322" font-size="12.5" fill="#52514e">reads the scratchpad at layers 46 and 52 (top-20 tokens)</text>
<text x="490" y="341" font-size="12.5" fill="#52514e">counts agreement, cooperation and collusion concepts</text>
<text x="490" y="360" font-size="12.5" fill="#52514e">strict echo filter: a concept counts only if it is not written</text>
<text x="490" y="378" font-size="12.5" fill="#52514e">anywhere in the prompt or reply</text>
<path d="M698,390 L698,428" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#arB)"/>
<rect x="584" y="432" width="228" height="44" rx="22" fill="#2a78d6"/>
<text x="698" y="460" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">score ≥ 1 → trigger</text>
<text x="698" y="506" font-size="12" text-anchor="middle" fill="#898781">threshold fixed on games 0–9; tested on games 10–19</text>

<!-- ===== Panel C: guardrails ===== -->
<text x="972" y="36" font-size="19" font-weight="700" fill="#0b0b0b">C  Guardrails compared</text>
<rect x="972" y="56" width="444" height="480" rx="10" fill="none" stroke="#e1e0d9"/>
<path d="M812,454 H960 V150 H990" stroke="#2a78d6" stroke-width="1.8" fill="none" marker-end="url(#arB)"/>
<path d="M960,300 H990" stroke="#2a78d6" stroke-width="1.8" fill="none" marker-end="url(#arB)"/>
<rect x="994" y="80" width="400" height="128" rx="8" fill="#ffffff" stroke="#c3c2b7"/>
<text x="1012" y="106" font-size="15" font-weight="700" fill="#0b0b0b">Steer (at the point of no return)</text>
<text x="1012" y="128" font-size="12.5" fill="#52514e">project out the top-16 lens concept directions</text>
<text x="1012" y="146" font-size="12.5" fill="#52514e">at layers 40–52 while the agent finishes the reply</text>
<text x="1012" y="164" font-size="12.5" fill="#52514e">control: matched directions from 154 random words</text>
<text x="1012" y="194" font-size="14" font-weight="700" fill="#898781">violations 88% → 84%  (n.s.)</text>
<rect x="994" y="230" width="400" height="148" rx="8" fill="#ffffff" stroke="#eb6834"/>
<text x="1012" y="256" font-size="15" font-weight="700" fill="#0b0b0b">Reminder (regenerate the decision)</text>
<text x="1012" y="278" font-size="12.5" fill="#52514e">rule restated before the output format; variants:</text>
<text x="1012" y="296" font-size="12.5" fill="#52514e">strictness · repeated rule · general rule ·</text>
<text x="1012" y="314" font-size="12.5" fill="#52514e">named loophole (“including through the private</text>
<text x="1012" y="332" font-size="12.5" fill="#52514e">channel”) · full = named loophole + strictness</text>
<text x="1012" y="362" font-size="14" font-weight="700" fill="#eb6834">violations 89% → 3%  (full reminder)</text>
<rect x="994" y="400" width="400" height="116" rx="8" fill="#ffffff" stroke="#c3c2b7"/>
<text x="1012" y="426" font-size="15" font-weight="700" fill="#0b0b0b">Whole games (10 per arm)</text>
<text x="1012" y="448" font-size="12.5" fill="#52514e">no guardrail · lens-triggered reminder ·</text>
<text x="1012" y="466" font-size="12.5" fill="#52514e">always-on reminder whenever the channel is open</text>
<text x="1012" y="496" font-size="14" font-weight="700" fill="#0b0b0b">violations 68% → 23% → 0.5%</text>
</svg>
